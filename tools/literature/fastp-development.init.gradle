// Preserve the canonical executable while validating new fastp development methods.
allprojects {
    afterEvaluate {
        def supplied = rootProject.findProperty('fastpDevelopmentOut')
        if (supplied == null || supplied.toString().trim().isEmpty()) {
            throw new GradleException('Supply -PfastpDevelopmentOut=NEW_DIRECTORY_UNDER_BUILD')
        }
        def base = rootProject.layout.buildDirectory.get().asFile.canonicalFile.toPath()
        def target = rootProject.file(supplied.toString()).canonicalFile
        if (!target.toPath().startsWith(base) || target.toPath() == base || target.exists()) {
            throw new GradleException('fastp development output must be a NEW directory under build')
        }
        tasks.named('executableJar', org.gradle.api.tasks.bundling.Jar) {
            destinationDirectory = target
            archiveFileName = "omicsmatic-${project.version}-fastp-development.jar"
            doFirst {
                if (archiveFile.get().asFile.exists()) {
                    throw new GradleException('Preserve the existing development executable; choose a NEW directory')
                }
            }
            doLast { println("fastp development JAR: ${archiveFile.get().asFile}") }
        }
    }
}
