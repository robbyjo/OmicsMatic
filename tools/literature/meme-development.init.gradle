// Preserve the canonical executable while developing MEME Suite integrations.
allprojects {
    afterEvaluate {
        def supplied = rootProject.findProperty('memeDevelopmentOut')
        if (supplied == null || supplied.toString().trim().isEmpty()) {
            throw new GradleException('Supply -PmemeDevelopmentOut=NEW_DIRECTORY_UNDER_BUILD')
        }
        def base = rootProject.layout.buildDirectory.get().asFile.canonicalFile.toPath()
        def target = rootProject.file(supplied.toString()).canonicalFile
        if (!target.toPath().startsWith(base) || target.toPath() == base || target.exists()) {
            throw new GradleException('MEME development output must be a NEW directory under build')
        }
        tasks.named('executableJar', org.gradle.api.tasks.bundling.Jar) {
            destinationDirectory = target
            archiveFileName = "omicsmatic-${project.version}-meme-development.jar"
            doFirst {
                if (archiveFile.get().asFile.exists()) throw new GradleException('Preserve the existing MEME development executable; choose a NEW directory')
            }
            doLast { println("MEME development JAR: ${archiveFile.get().asFile}") }
        }
    }
}
