name: Deploy project website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage published website
        # Keep development reports off Pages until their release build is ready.
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          from shutil import copytree, ignore_patterns

          copytree(
              "site",
              Path(os.environ["RUNNER_TEMP"]) / "omicsmatic-site",
              ignore=ignore_patterns("literature-review.html", "literature-warnings.html"),
          )
          PYTHON
      - name: Name this build's artifact
        id: artifact-name
        shell: bash
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          # Re-running a build must not leave two artifacts with the same name.
          name: ${{ steps.artifact-name.outputs.name }}
          path: ${{ runner.temp }}/omicsmatic-site

  deploy:
    # A separate job also allows the artifact lookup service to see the upload.
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Keep the completed build's name when only deployment is re-run.
          artifact_name: ${{ needs.build.outputs.artifact_name }}
