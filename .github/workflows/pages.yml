name: Deploy project website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage published website
        # Keep development reports off Pages until their release build is ready.
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          from shutil import copytree, ignore_patterns

          copytree(
              "site",
              Path(os.environ["RUNNER_TEMP"]) / "omicsmatic-site",
              ignore=ignore_patterns("literature-review.html", "literature-warnings.html"),
          )
          PYTHON
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/omicsmatic-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
